<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fanfarra - Alunos</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark">
<div class="container">
<a class="navbar-brand fw-bold" href="index.html">🎺 FANFARRA</a>
<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"><span class="navbar-toggler-icon"></span></button>
<div class="collapse navbar-collapse" id="menu">
<ul class="navbar-nav ms-auto">
<li class="nav-item"><a class="nav-link" href="index.html">📋 Chamada</a></li>
<li class="nav-item"><a class="nav-link active" href="alunos.html">👥 Alunos</a></li>
<li class="nav-item"><a class="nav-link" href="instrumentos.html">🥁 Instrumentos</a></li>
</ul>
</div>
</div>
</nav>

<main class="container py-4">
<div class="page-header">
<div><h1>👥 Alunos</h1><p>Cadastre os integrantes da fanfarra.</p></div>
<button class="btn btn-primary" onclick="abrirModalAluno()">➕ Novo aluno</button>
</div>

<div class="card shadow-sm"><div class="card-body">
<div class="table-responsive">
<table class="table table-hover align-middle">
<thead><tr><th>Nome</th><th>Turma</th><th>Instrumento</th><th>Nº</th><th>Ações</th></tr></thead>
<tbody id="listaAlunos"></tbody>
</table>
</div>
</div></div>
</main>

<div class="modal fade" id="modalAluno" tabindex="-1">
<div class="modal-dialog"><div class="modal-content">
<div class="modal-header"><h5 class="modal-title">Cadastro de aluno</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
<div class="modal-body">
<input type="hidden" id="alunoId">
<div class="mb-3"><label class="form-label">Nome</label><input type="text" id="nomeAluno" class="form-control"></div>
<div class="mb-3"><label class="form-label">Turma</label><input type="text" id="turmaAluno" class="form-control" placeholder="Ex.: 8º A"></div>
<div class="mb-3"><label class="form-label">Instrumento</label><select id="instrumentoAluno" class="form-select"></select></div>
<div class="mb-3"><label class="form-label">Número do instrumento</label><input type="number" id="numeroInstrumento" class="form-control" min="1"></div>
</div>
<div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button><button class="btn btn-primary" onclick="salvarAluno()">💾 Salvar</button></div>
</div></div>
</div>

<footer><p>🎺 Sistema de Controle da Fanfarra</p></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
</body>
</html>
