<!-- =========================
     CONTEÚDO
========================= -->

<main class="container py-4">

<section>

    <div class="page-header">
        <div>
            <h1>⚠️ Problemas</h1>
            <p>Registre problemas encontrados nos instrumentos.</p>
        </div>
        <a href="index.html" class="btn btn-outline-secondary">← Início</a>
    </div>

    <div class="card mb-4">
        <div class="card-body">
            <h5 class="mb-3">Registrar problema</h5>
            <form id="fProblema">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label" for="descricaoProblema">Descrição</label>
                        <input type="text" id="descricaoProblema" class="form-control" placeholder="Descreva o problema" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" for="instrumentoProblema">Instrumento</label>
                        <select id="instrumentoProblema" class="form-select">
                            <option value="">Nenhum instrumento específico</option>
                        </select>
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button class="btn btn-danger w-100" type="submit">Registrar</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <p class="text-muted"><strong id="contadorProblemas">0 em aberto</strong></p>

    <div id="problemas"></div>
</section>

</main>


<footer>
    <p>🎺 Sistema da Fanfarra</p>
</footer>
