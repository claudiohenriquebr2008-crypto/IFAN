<!-- =========================
     CONTEÚDO
========================= -->

<main class="container py-4">

<section>

    <div class="page-header">
        <div>
            <h1>📋 Chamada</h1>
            <p>Registre a presença dos alunos nos ensaios. Tudo é salvo automaticamente.</p>
        </div>
        <a href="index.html" class="btn btn-outline-secondary">← Início</a>
    </div>

    <div class="card mb-4">
        <div class="card-body">
            <label class="form-label" for="dataChamada">Data do ensaio</label>
            <input type="date" id="dataChamada" class="form-control" style="max-width: 260px;">
        </div>
    </div>

    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="sum">Total <strong id="total">0</strong></div>
        </div>
        <div class="col-md-4">
            <div class="sum good">Presentes <strong id="presentes">0</strong></div>
        </div>
        <div class="col-md-4">
            <div class="sum bad">Faltas <strong id="faltas">0</strong></div>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                        <tr>
                            <th>Aluno</th>
                            <th>Turma</th>
                            <th>Instrumento</th>
                            <th>Nº</th>
                            <th>Presença</th>
                            <th>Observação</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaChamada"></tbody>
                </table>
            </div>

            <button id="salvarChamada" class="btn btn-success">💾 Salvar chamada</button>
        </div>
    </div>
</section>

</main>


<footer>
    <p>🎺 Sistema da Fanfarra</p>
</footer>


<!-- MENSAGENS -->
<div id="toasts" class="toast-container position-fixed bottom-0 end-0 p-3"></div>
