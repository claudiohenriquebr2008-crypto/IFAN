<!-- =========================
     CONTEÚDO
========================= -->

<main class="container py-4">

    <section>

        <h2>📋 Chamada</h2>

        <p class="text-muted">
            Registre a presença dos alunos nos ensaios.
        </p>


        <!-- DATA -->

        <div class="card mb-4">

            <div class="card-body">

                <label
                    for="data"
                    class="form-label fw-bold">

                    Data da chamada

                </label>

                <input
                    type="date"
                    id="data"
                    class="form-control">

            </div>

        </div>


        <!-- RESUMO -->

        <div class="row g-3 mb-4">

            <div class="col-4">

                <div class="sum">

                    <strong id="total">
                        0
                    </strong>

                    Total

                </div>

            </div>


            <div class="col-4">

                <div class="sum good">

                    <strong id="presentes">
                        0
                    </strong>

                    Presentes

                </div>

            </div>


            <div class="col-4">

                <div class="sum bad">

                    <strong id="faltas">
                        0
                    </strong>

                    Faltas

                </div>

            </div>

        </div>


        <!-- TABELA -->

        <div class="card">

            <div class="card-body">

                <div class="table-responsive">

                    <table
                        class="table table-hover align-middle">

                        <thead>

                            <tr>

                                <th>
                                    Aluno
                                </th>

                                <th>
                                    Turma
                                </th>

                                <th>
                                    Instrumento
                                </th>

                                <th>
                                    Nº
                                </th>

                                <th>
                                    Presença
                                </th>

                                <th>
                                    Observação
                                </th>

                            </tr>

                        </thead>

                        <tbody id="tabela">

                            <!--
                                Os alunos serão
                                carregados pelo app.js
                            -->

                        </tbody>

                    </table>

                </div>


                <button
                    id="salvar"
                    class="btn btn-success">

                    💾 Salvar chamada

                </button>

            </div>

        </div>

    </section>

</main>


<!-- =========================
     RODAPÉ
========================= -->

<footer>

    🎺 Sistema de Gerenciamento da Fanfarras

</footer>


<!-- =========================
     TOASTS
========================= -->

<div
    id="toasts"
    class="position-fixed bottom-0 end-0 p-3">

</div>

========================= -->

    firebase.initializeApp(firebaseConfig);
