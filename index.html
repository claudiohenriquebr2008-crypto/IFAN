<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fanfarra - Chamada</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark">
<div class="container">
<a class="navbar-brand fw-bold" href="index.html">🎺 FANFARRA</a>
<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"><span class="navbar-toggler-icon"></span></button>
<div class="collapse navbar-collapse" id="menu">
<ul class="navbar-nav ms-auto">
<li class="nav-item"><a class="nav-link active" href="index.html">📋 Chamada</a></li>
<li class="nav-item"><a class="nav-link" href="alunos.html">👥 Alunos</a></li>
<li class="nav-item"><a class="nav-link" href="instrumentos.html">🥁 Instrumentos</a></li>
</ul>
</div>
</div>
</nav>

<main class="container py-4">
<div class="page-header">
<div><h1>📋 Chamada da Fanfarra</h1><p>Controle a presença dos integrantes da banda.</p></div>
<div><label for="dataChamada" class="form-label fw-bold">Data</label><input type="date" id="dataChamada" class="form-control"></div>
</div>

<div class="row g-3 mb-4">
<div class="col-md-4"><div class="summary-card"><span>👥 Total</span><strong id="totalAlunos">0</strong></div></div>
<div class="col-md-4"><div class="summary-card presente"><span>🟢 Presentes</span><strong id="totalPresentes">0</strong></div></div>
<div class="col-md-4"><div class="summary-card falta"><span>🔴 Faltas</span><strong id="totalFaltas">0</strong></div></div>
</div>

<div class="card shadow-sm">
<div class="card-header"><h5 class="mb-0">Lista de alunos</h5></div>
<div class="table-responsive">
<table class="table table-hover align-middle mb-0">
<thead><tr><th>Aluno</th><th>Turma</th><th>Instrumento</th><th>Nº</th><th>Presença</th><th>Observação</th></tr></thead>
<tbody id="listaChamada"></tbody>
</table>
</div>
</div>

<div class="d-flex justify-content-end mt-3">
<button class="btn btn-primary" onclick="salvarChamada()">💾 Salvar chamada</button>
</div>
</main>

<footer><p>🎺 Sistema de Controle da Fanfarra</p></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
</body>
</html>
