<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — Fanfarra IFAN</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="login-wrap">
    <section class="login-card">
      <h1>🎺 FANFARRA</h1>
      <h2>Entrar no IFAN</h2>
      <p class="login-help">Admin: gerencia tudo. Aluno: vê avisos e eventos e reporta problemas.</p>
      <form id="loginForm">
        <label for="email">E-mail</label>
        <input id="email" type="email" autocomplete="username" required>
        <label for="senha">Senha</label>
        <input id="senha" type="password" autocomplete="current-password" required>
        <button id="entrar" type="submit">Entrar</button>
        <div id="mensagem" class="login-msg" role="alert"></div>
      </form>
      <div class="login-cad">
        <p class="login-help">Novo aluno? Preencha e-mail e senha e clique em Cadastrar (entra como aluno).</p>
        <button id="cadastrar" type="button" class="sec">Cadastrar</button>
      </div>
    </section>
  </main>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
